<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2340d9">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Seyyar Satış</title>
<script>try{var t=localStorage.getItem("ss_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;if(JSON.parse(localStorage.getItem("ss_font"))==="big")document.documentElement.classList.add("big");}catch(e){}</script>
<style>
:root{--bg:#eef0f7;--card:#fff;--ink:#141938;--muted:#5f6787;--line:#dde1ee;--pri:#2340d9;--pri-ink:#fff;--pri-soft:#e6eaff;--acc:#ffcf33;--acc-ink:#141938;--warn:#b86a00;--warn-soft:#fff2d6;--bad:#d42a3a;--bad-soft:#ffe8ea;--ok:#0b8a5f;--band:#2340d9;--r:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1028;--card:#171b3a;--ink:#eef0ff;--muted:#9aa1c7;--line:#272d57;--pri:#7088ff;--pri-ink:#0d1028;--pri-soft:#222a5e;--acc:#ffcf33;--acc-ink:#141938;--warn:#ffb547;--warn-soft:#3a2d12;--bad:#ff6b78;--bad-soft:#3d1a22;--ok:#3ddc97;--band:#1d2a8a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0d1028;--card:#171b3a;--ink:#eef0ff;--muted:#9aa1c7;--line:#272d57;--pri:#7088ff;--pri-ink:#0d1028;--pri-soft:#222a5e;--acc:#ffcf33;--acc-ink:#141938;--warn:#ffb547;--warn-soft:#3a2d12;--bad:#ff6b78;--bad-soft:#3d1a22;--ok:#3ddc97;--band:#1d2a8a;color-scheme:dark}
:root[data-theme=light]{color-scheme:light}
#themeBtn{width:38px;height:38px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px;flex:none}#themeBtn svg{width:20px;height:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#backBtn{width:38px;height:38px;border:0;background:none;color:var(--ink);padding:6px;margin-left:-6px}
#backBtn svg{width:24px;height:24px}
.pill{font:inherit;font-size:12px;padding:5px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted);white-space:nowrap;cursor:pointer}
.pill.on{background:var(--pri-soft);color:var(--pri);border-color:transparent;font-weight:600}
.pill.off{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
main{padding:12px 12px calc(92px + env(safe-area-inset-bottom));max-width:1100px;margin:0 auto}
body.auth header,body.auth nav{display:none}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:8px 2px 7px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.act{color:var(--pri);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums}.right{text-align:right}
h2{font-size:17px;margin:4px 0 10px}h3{font-size:15px;margin:0 0 8px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px}
input:disabled,select:disabled{opacity:.6}
textarea{min-height:80px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
label.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;margin-top:12px}
label.chk input{width:22px;min-height:22px;height:22px;margin:0}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:10px 14px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-decoration:none;text-align:center}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:transparent}
.btn.bad{color:var(--bad);border-color:var(--bad-soft)}
.btn.block{width:100%}.btn.big{min-height:56px;font-size:17px;margin-top:10px;width:100%}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45}.btn svg{width:20px;height:20px}
.iconbtn{width:46px;padding:0;flex:none}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:8px 2px;border-radius:8px;color:var(--muted);min-height:38px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips .sep{flex:none;width:1px;background:var(--line);margin:0 2px}
.list .it{display:flex;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:0}
.it.click,.click{cursor:pointer}
.it .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-weight:600;white-space:nowrap}
.tag.w{background:var(--warn-soft);color:var(--warn)}.tag.b{background:var(--bad-soft);color:var(--bad)}
.qty{display:flex;align-items:center;gap:4px;flex:none}
.qty button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;line-height:1}
.qty input{width:58px;min-height:36px;padding:4px;text-align:center}
.total{font-size:28px;font-weight:800}
.lnk{text-decoration:underline dotted;cursor:pointer}
.searchbox{position:relative}
.results{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:55vh;overflow:auto;z-index:15}
.results .it{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat.clickable{cursor:pointer}.stat.sel{outline:2px solid var(--pri)}
.stat .v{font-size:20px;font-weight:800}.stat .k{font-size:12px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:12px;margin-bottom:12px;font-weight:700}
.b-buy{background:var(--pri-soft);color:var(--pri)}.b-ret{background:var(--warn-soft);color:var(--warn)}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
@media(min-width:860px){.pos{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:start}.pos .side{position:sticky;top:64px}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.dlg{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:620px){.ov{align-items:center}.dlg{border-radius:18px}}
.dlg .acts{display:flex;gap:8px;margin-top:14px}.dlg .acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;text-align:center}
video{width:100%;border-radius:12px;background:#000;max-height:50vh;object-fit:cover}
pre.rc{font:12.5px/1.35 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;white-space:pre;overflow:auto;margin:0;max-height:45vh}
.hint{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px;margin-top:8px}
.danger{color:var(--bad)}.okc{color:var(--ok)}.warnc{color:var(--warn)}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.login{max-width:400px;margin:8vh auto 0;padding:0 8px}
.login h1{margin:8px 0 2px;font-size:26px}
.login .logo{width:56px;height:56px;border-radius:16px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center}.login .logo svg{width:32px;height:32px}
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{display:block;position:absolute;left:0;top:0;width:100%}@page{margin:6mm}}
.inv{font:12px/1.35 Arial,sans-serif;color:#000;background:#fff}
.inv table{width:100%;border-collapse:collapse}.inv td,.inv th{border:1px solid #999;padding:4px 5px;text-align:left}.inv th{background:#eee}.inv .r{text-align:right}
.inv .hd{display:flex;justify-content:space-between;gap:16px;margin-bottom:10px}.inv .box{border:1px solid #999;padding:8px;flex:1}
.thermal{font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;white-space:pre;color:#000;background:#fff}
/* v2.2 sade arayüz */
html.big{font-size:18px}html.big body{zoom:1.12}
.today{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;scrollbar-width:none}
.today>div{display:flex;flex-direction:column;min-width:76px;flex:1}.today .k{font-size:11px;color:var(--muted)}.today b{font-size:16px}
.bigin{font-size:18px!important;min-height:52px}.btn.big1,.big1{min-height:52px;min-width:52px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:12px}
.qt{position:relative;font:inherit;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:74px;display:flex;flex-direction:column;justify-content:space-between;gap:4px;color:var(--ink);cursor:pointer}
.qt:active{transform:scale(.97)}.qt.in{border-color:var(--pri);background:var(--pri-soft)}
.qn{font-size:13px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qp{font-size:13px;color:var(--muted)}.qt.in .qp{color:var(--pri)}
.qc{position:absolute;top:-7px;right:-7px;background:var(--pri);color:var(--pri-ink);border-radius:99px;min-width:24px;height:24px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.qe{align-items:center;justify-content:center;color:var(--muted);border-style:dashed;font-size:20px}.qe .qn{font-size:12px;font-weight:500}
.star{font-size:20px;color:var(--line);margin-right:4px}.star.on{color:#f5b301}
.seg.big button{min-height:52px;font-size:16px}.seg.big button.on{background:var(--pri);color:var(--pri-ink)}
.btn.big{min-height:58px;font-size:18px;margin-top:10px}
details.other{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.other>summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0;list-style:none}details.other>summary::-webkit-details-marker{display:none}
details.other>summary::before{content:"▸ ";}details.other[open]>summary::before{content:"▾ "}
.cash{text-align:center}.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.cgrid .btn{min-height:56px;font-size:16px}
.change{margin:12px 0 4px;font-size:15px;color:var(--muted);text-align:center}.change b,.change .big1{display:block;font-size:38px;font-weight:800;color:var(--ok)}
.sheet{display:flex;flex-direction:column;gap:6px}.sheet .btn{min-height:52px}
.xbtn{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:99px;color:var(--muted);margin-left:4px}.xbtn svg{width:16px;height:16px}
.pillsel{width:auto;min-height:32px;padding:4px 10px;font-size:13px;border-radius:99px}
.steps{display:flex;gap:6px;margin-bottom:10px;font-size:12px}.steps span{flex:1;padding:6px;border-radius:8px;background:var(--bg);color:var(--muted);text-align:center}.steps .on{background:var(--pri-soft);color:var(--pri);font-weight:700}.steps .done{color:var(--ok)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid3 .btn{padding:10px 6px;font-size:14px}
.seg.mini button{min-height:28px;padding:2px 4px;font-size:12px}
/* v2.8 tasarım: kobalt tabela */
html{background:var(--bg)}
html,body{font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em}
body{background:transparent;position:relative;min-height:100vh}
body:not(.auth)::before{content:"";position:absolute;z-index:-1;left:0;right:0;top:0;height:calc(150px + env(safe-area-inset-top));background:var(--band);border-radius:0 0 32px 32px}
header{background:var(--band);color:#fff;border-bottom:0;padding:10px 16px 12px}
header h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
#backBtn{color:#fff}
#themeBtn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
header .pill{border-color:transparent}
main{padding:6px 14px calc(100px + env(safe-area-inset-bottom))}
h2{font-size:18px;font-weight:700;letter-spacing:-.01em}h3{font-size:16px;font-weight:600}
.card{border-radius:var(--r);border-color:transparent;padding:16px}
:root[data-theme=dark] .card{border-color:var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .card{border-color:var(--line)}}
.stat{border-radius:16px;border-color:transparent;background:var(--bg)}
.card .stat{background:var(--bg)}
.stats>.stat{background:var(--card)}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
input,select,textarea{border-radius:14px;background:var(--bg);border-color:transparent}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);background:var(--card)}
.btn{border-radius:14px;font-weight:600;border-color:var(--line)}
.btn.pri{box-shadow:0 6px 16px -8px var(--pri)}
.btn.big{border-radius:18px;font-size:19px;font-weight:700;min-height:60px}
.seg{border-radius:14px;border-color:transparent}
.seg button{border-radius:11px}
.seg.big button.on{background:var(--pri);color:var(--pri-ink);box-shadow:none}
.pill{border-radius:99px;padding:6px 12px;font-size:13px}
.pill.on{background:var(--ink);color:var(--card)}
.tag{border-radius:6px}
.list .it{padding:13px 2px}
.total{font-size:34px;font-weight:700;letter-spacing:-.03em}
.today{background:var(--card);border:0;border-radius:var(--r);padding:14px 16px}
.today b{font-size:18px;font-weight:700;letter-spacing:-.02em}
.qt{border-radius:16px;border:1.5px solid transparent;min-height:80px}
.qt.in{border-color:var(--pri);background:var(--pri-soft)}
.qc{background:var(--acc);color:var(--acc-ink);top:-8px;right:-6px;min-width:26px;height:26px;font-size:13px;box-shadow:0 0 0 3px var(--bg)}
.qe{border:1.5px dashed var(--line);background:transparent}
.qty button{border-radius:12px;border-color:transparent;background:var(--bg)}
.qty input{border-radius:12px}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border:0;border-radius:24px;background:var(--card);box-shadow:0 10px 30px -12px rgba(20,25,56,.35)}
nav button{border-radius:18px;padding:7px 2px 6px;font-size:11.5px;gap:2px}
nav button.act{background:var(--pri-soft);color:var(--pri)}
.toast{border-radius:16px;bottom:calc(96px + env(safe-area-inset-bottom))}
.ov{background:rgba(13,16,40,.5)}
.dlg{border-radius:28px 28px 0 0;padding-top:22px;position:relative}
.dlg::before{content:"";position:absolute;top:8px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line)}
@media(min-width:620px){.dlg{border-radius:28px}.dlg::before{display:none}}
.results{border-radius:16px;border-color:var(--line)}
.banner{border-radius:16px}
.login .logo{border-radius:20px;background:var(--band)}
.login h1{font-weight:700;letter-spacing:-.02em}
.change b,.change .big1{font-weight:700}
.star.on{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
body.auth input,body.auth select{background:var(--card);border-color:var(--line)}
.searchbox input{background:var(--card);border-color:var(--line)}
.card .searchbox input{background:var(--bg);border-color:transparent}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:0s!important}}
</style>
</head>
<body>
<header>
  <button id="backBtn" style="display:none" aria-label="Geri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="ttl">Satış</h1>
  <span class="pill" id="netPill" style="display:none">●</span>
  <span class="pill" id="prnPill" style="display:none">🖨</span>
  <button id="themeBtn" aria-label="Tema"></button>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="printArea"></div>
<script src="js/core.js?v=2.8"></script>

</body>
</html>
